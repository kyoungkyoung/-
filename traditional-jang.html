d:white;border-radius:22px;padding:24px;border:1px solid var(--line)}.num{color:#83a45a;font-weight:900;font-size:.85rem}.step h3{margin:8px 0}.step p{margin:0;color:var(--muted);font-size:.92rem}.cta{background:#f8d5c2;border-radius:30px;padding:32px 38px;display:flex;justify-content:space-between;align-items:center;gap:20px}.cta h2{margin:0;font-size:1.8rem;letter-spacing:-.04em}.cta p{margin:6px 0;color:#695b50}.faq details{background:white;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin:10px 0}.faq summary{font-weight:750;cursor:pointer}.faq details p{color:var(--muted);margin-bottom:0}.footer{padding:32px 0;color:#738076;font-size:.85rem;border-top:1px solid var(--line)}.footerrow{display:flex;justify-content:space-between;gap:15px}.hide{display:none}.detail{padding:40px 0 76px}.back{border:0;background:none;color:var(--green);font-weight:700;cursor:pointer;padding:0 0 25px}.detailbox{background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,52px);display:grid;grid-template-columns:.8fr 1.2fr;gap:35px}.detailicon{font-size:5rem;background:#f2f4dd;width:130px;height:130px;border-radius:35px;display:grid;place-items:center}.detailbox h1{font-size:2.5rem;line-height:1.2;letter-spacing:-.05em}.detailbox p{color:var(--muted)}.detailbox h3{margin-bottom:6px}.detailbox ul{padding-left:20px;color:#506057}.tag{display:inline-block;background:#eff3dd;border-radius:30px;padding:6px 12px;color:#53694a;font-size:.85rem;margin-right:6px}

<main id="homeView"><section id="programs"><div class="wrap"><div class="sectionhead"><div><span class="eyebrow">WHO & WHAT</span><h2>누구와, 무엇을 배울까요?</h2><p>관심 있는 분야를 눌러 수업의 큰 흐름을 확인해 보세요.</p></div></div><div class="cards" id="cards"></div></div></section>
</main>
<main id="detailView" class="hide"><section class="wrap detail"><button class="back" onclick="location.href='programs.html'">← 분야 목록으로</button><div class="detailbox" id="detailbox"></div></section></main>
<footer class="footer"><div class="wrap footerrow"><span><b>바른밥상 🌱</b>　즐거운 식생활교육</span><span>교육 내용은 대상과 운영 환경에 따라 조정됩니다. · 연락처와 기관 정보는 실제 정보로 바꿔주세요.</span></div></footer>
<script>
const programs=[
{icon:'🌾',title:'유아·어린이',desc:'논에서 식탁까지, 오감으로 배우는 먹거리',tags:['오감으로 만나는 식재료','알록달록 골고루 먹기','건강한 간식 고르기','벼와 쌀 이야기'],who:'유아 및 초등 저학년',about:'놀이와 감각 활동으로 식재료에 대한 호기심을 키우고, 쌀이 자라 밥이 되는 과정을 알아봐요.',activities:['제철 채소·과일 관찰과 촉감 놀이','벼와 쌀의 한살이 살펴보기','다양한 색깔 음식과 건강 간식 알아보기']},
{icon:'🌱',title:'청소년',desc:'내 몸과 식생활을 잇는 건강한 선택',tags:['균형 잡힌 한 끼','식품 정보 읽기','지속가능한 식생활'],who:'초등 고학년 및 청소년',about:'스스로 선택하는 힘을 기르고 일상 속 식습관을 돌아봐요.',activities:['한 끼 구성과 식품군 알아보기','식품 표시와 간식 선택 살펴보기','기후 변화와 먹거리의 관계 생각하기']},
{icon:'🥣',title:'전통장 교육',desc:'콩에서 장까지, 우리 발효의 지혜',tags:['콩과 메주','전통장 만들기','장독과 발효'],who:'유아부터 성인까지',about:'콩이 메주와 된장·간장으로 바뀌는 과정을 오감으로 살펴보고, 장독과 발효에 담긴 우리 음식 문화를 배워요.',activities:['콩·메주·소금 등 장 재료 관찰하기','된장과 간장이 만들어지는 과정 알아보기','발효와 장독의 역할 이야기 나누기']},
{icon:'🫙',title:'발효음식 이야기',desc:'시간이 만드는 맛, 발효를 만나요',tags:['김치와 발효','발효 음식과 건강','음식 보관과 숙성'],who:'어린이, 청소년, 성인·가족',about:'김치와 장처럼 익숙한 발효 음식에서 미생물과 시간의 역할을 발견하고, 안전한 보관과 숙성 방법을 익혀요.',activities:['김치·된장·간장 등 발효 음식 비교하기','발효에 따른 향·맛·질감의 변화 살펴보기','발효 음식의 보관과 위생 알아보기']},
{icon:'🥕',title:'성인·가족',desc:'가정의 식탁에서 시작하는 실천',tags:['가족 식탁','제철·지역 먹거리','식생활과 환경'],who:'성인, 보호자 및 가족',about:'가정에서 바로 적용할 수 있는 식생활 팁과 가족 활동을 나눠요.',activities:['가족 식탁의 균형과 식사 환경 돌아보기','제철·지역 식재료 활용 아이디어','함께 준비하는 간단한 식사 활동']},
{icon:'🍚',title:'어르신',desc:'건강하고 즐거운 식사 생활',tags:['건강한 식사 습관','식품 안전','함께 먹는 즐거움'],who:'어르신 및 관련 기관',about:'일상에서 실천할 수 있는 안전하고 편안한 식생활을 함께 살펴봐요.',activities:['규칙적인 식사와 다양한 음식 이야기','식품 보관·위생의 기본','함께 나누는 식사와 음식 경험']}
];
const cards=document.querySelector('#cards'),chips=document.createElement('div');programs.forEach((p,i)=>{cards.innerHTML+=`<a class="card" href="#detail" onclick="showDetail(${i});return false"><span class="arrow">↗</span><div class="icon">${p.icon}</div><h3>${p.title}</h3><p>${p.desc}</p></a>`;p.tags.forEach(t=>{if(![...chips.children].some(c=>c.textContent===t)){chips.innerHTML+=`<button class="chip" onclick="selectTopic(this,'${t}')">${t}</button>`}})});
function selectTopic(el,t){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');let p=programs.find(x=>x.tags.includes(t));document.querySelector('#topicResult').innerHTML=`<div><span class="tag">${p.title}</span><h3>${t}</h3><p>${p.about}</p><a class="btn" href="#detail" onclick="showDetail(${programs.indexOf(p)});return false">${p.title} 자세히 보기 ↗</a></div><ul>${p.activities.slice(0,3).map(a=>`<li>${a}</li>`).join('')}</ul>`}
function showDetail(i){let p=programs[i];document.querySelector('#homeView').classList.add('hide');document.querySelector('#detailView').classList.remove('hide');document.querySelector('#detailbox').innerHTML=`<div><div class="detailicon">${p.icon}</div><h1>${p.title}</h1><span class="tag">대상 · ${p.who}</span></div><div><span class="eyebrow">CLASS OVERVIEW</span><h2>${p.desc}</h2><p>${p.about}</p><h3>수업에서 다루는 내용</h3><ul>${p.activities.map(a=>`<li>${a}</li>`).join('')}</ul><h3>이런 방식으로 진행해요</h3><p>짧은 이야기 나누기와 참여 활동을 중심으로 진행하며, 인원·시간·장소에 맞춰 실습 여부와 활동 난이도를 조정합니다.</p><a class="btn" href="contact.html">이 분야 수업 문의하기 ↗</a></div>`;window.scrollTo(0,0)}function showHome(){document.querySelector('#detailView').classList.add('hide');document.querySelector('#homeView').classList.remove('hide')}


showDetail(2);
</script></body></html>
